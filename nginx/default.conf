# Common proxy headers
map $http_x_forwarded_for $xff {
    default "$http_x_forwarded_for, $remote_addr";
    ""      "$remote_addr";
}

# www to non-www redirect for winterwait.com
server {
    listen 80;
    listen [::]:80;
    server_name www.winterwait.com;
    return 301 http://winterwait.com$request_uri;
}

# Blog frontend - winterwait.com
server {
    listen 80;
    listen [::]:80;
    server_name winterwait.com;

    location / {
        proxy_pass http://flec_blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin dashboard - admin.winterwait.com
server {
    listen 80;
    listen [::]:80;
    server_name admin.winterwait.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://flec_admin:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API server - api.winterwait.com
server {
    listen 80;
    listen [::]:80;
    server_name api.winterwait.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://flec_server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
