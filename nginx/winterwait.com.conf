# winterwait.com - Blog Frontend (winterwait.com)
server {
    server_name winterwait.com www.winterwait.com;

    # ACME certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/winterwait.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winterwait.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.winterwait.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = winterwait.com) {
        return 301 https://$host$request_uri;
    }

    server_name winterwait.com www.winterwait.com;

    # ACME certificate validation (before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    listen 80;
    return 301 https://$host$request_uri;
}

